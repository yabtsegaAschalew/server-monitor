[project]
name = "server-monitor"
version = "0.1.0"
description = "Asynchronous server monitoring system (Phase 1: config, state engine, persistence)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "aiosmtplib>=5.1.2",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "prometheus-client>=0.20.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except: broad catches must be justified
    "TRY",  # try/except style
    "PIE",  # misc simplifications
    "RUF",  # ruff-specific rules
]
ignore = ["TRY003"]  # long exception messages are fine on our own raise sites

[tool.ruff.lint.isort]
known-first-party = ["alerting", "collectors", "config", "database", "main", "models", "state_engine"]
