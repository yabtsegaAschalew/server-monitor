[project]
name = "server-monitor"
version = "0.1.0"
description = "Asynchronous server monitoring system (Phases 1-4: collectors, database, diagnostic agent, multi-burn-rate alerting)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "aiosmtplib>=5.1.2",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "prometheus-client>=0.20.0",
    "pysnmp>=7.1.0",
    "pysnmp-mibs>=0.1.6",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "TRY",
    "PIE",
    "RUF",
]
ignore = ["TRY003"]

[tool.ruff.lint.isort]
# Kept in sync with the actual top-level modules. "alerting" and "state_engine"
# were listed here but have never existed; the alert engine is `alert_engine`.
known-first-party = [
    "alert_engine",
    "collectors",
    "config",
    "database",
    "diagnostic",
    "main",
    "models",
    "providers",
]
